# Producción / piloto en un solo PC (p. ej. el ASUS). Uso:
#   cp deploy/.env.prod.example deploy/.env   (y rellenar)
#   docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d --build
name: arriero
services:
  db:
    image: imresamu/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: despacho
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d despacho"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Sin puertos publicados: solo el API la alcanza, dentro de la red de Docker.

  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/despacho
      APP_DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@db:5432/despacho
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${PANEL_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      SEED_BASE: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ports: ["4000:4000"]

  panel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: panel
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
    restart: unless-stopped
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  db-data:
